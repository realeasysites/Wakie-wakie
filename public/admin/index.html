<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Wakie Wakie's — Messages</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
:root{--sage:#586d5a;--sage-d:#3f5141;--cream:#efe9dd;--paper:#f7f3ea;--ink:#26302a;--star:#d9472b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--sage-d);color:var(--cream);padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.2rem}button{font:inherit;cursor:pointer}
.wrap{width:min(960px,92vw);margin:30px auto}
.login{max-width:360px;margin:12vh auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.login input{width:100%;padding:12px;border:2px solid #ccd5cb;border-radius:10px;font:inherit;margin:10px 0}
.btn{background:var(--sage-d);color:#fff;border:0;padding:10px 18px;border-radius:999px;font-weight:700}
.btn--ghost{background:transparent;border:2px solid var(--cream);color:var(--cream)}
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filters button{border:2px solid var(--sage);background:#fff;border-radius:999px;padding:6px 14px}
.filters button.on{background:var(--sage);color:#fff}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:12px;border-left:6px solid var(--star);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card.contacted{border-color:#e2a83a}.card.done{border-color:var(--sage);opacity:.75}
.card h3{margin:0 0 4px}.meta{color:#5d665f;font-size:.9rem}.card p{white-space:pre-wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:7px;border-radius:8px}.del{background:none;border:2px solid var(--star);color:var(--star);border-radius:999px;padding:6px 14px;margin-left:auto}
.err{color:var(--star)}.empty{text-align:center;color:#5d665f;padding:40px}
</style></head>
<body>
<div id="app"></div>
<script src="/admin/admin.js"></script>
</body></html>
